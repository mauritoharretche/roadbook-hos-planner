[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hos-trip-planner"
version = "0.1.0"
description = "Framework-independent HOS planning domain for the assessment"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<6.0",
  "djangorestframework>=3.16,<4.0",
  "django-cors-headers>=4.9,<5.0",
  "gunicorn>=23.0,<24.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/apps/trips/tests"]
addopts = "-ra"
